<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Owner Dashboard — Pluto Collections</title>
<meta name="description" content="Pluto Collections owner dashboard: orders, tracking, customers, products, content and payments." />
<meta name="robots" content="noindex" />
<link rel="icon" href="images/logo1.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Karla:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<style>
:root{
  --brown:#3a2415; --brown-2:#5a3b23; --gold:#c6a43b; --gold-dark:#9a7c26;
  --ivory:#f7f3ea; --sand:#efe7d8; --ink:#20160e; --muted:#6d5c4a; --line:#ddd0ba;
  --white:#fffdf9; --green:#1f8b4c; --red:#b23b3b; --blue:#2b5f8b;
  --side:246px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ivory);color:var(--ink);font-family:'Karla',system-ui,sans-serif;font-size:15px;line-height:1.55}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;margin:0;font-weight:600}
:focus-visible{outline:2px solid var(--gold-dark);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--white);outline:none;min-height:42px}
textarea{min-height:80px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:block;margin:0 0 5px}
.field{margin-bottom:12px}
.hide{display:none!important}
.btn{border:1px solid var(--brown);background:transparent;color:var(--brown);padding:10px 15px;cursor:pointer;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;transition:.18s}
.btn:hover{background:var(--brown);color:#fff}
.btn.gold{border-color:transparent;color:#fff;background:linear-gradient(120deg,var(--brown),var(--brown-2) 45%,var(--gold-dark))}
.btn.gold:hover{filter:brightness(1.14)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{background:var(--sand);color:var(--brown)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red);color:#fff}
.btn.sm{padding:8px 10px;font-size:10px;min-height:38px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.note{font-size:12px;color:var(--muted)}
.err{color:var(--red);font-size:12px}
.eyebrow{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-dark);margin:0}
.rule{width:56px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:10px 0 16px}

/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:20px;
  background:radial-gradient(1200px 500px at 50% -10%,rgba(198,164,59,.22),transparent),var(--ivory)}
.login .box{background:var(--white);border:1px solid var(--line);padding:34px;max-width:420px;width:100%;text-align:center;
  box-shadow:0 40px 90px -60px rgba(58,36,21,.9)}
.login img{height:78px;margin:0 auto 14px}

/* shell */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100dvh}
aside{background:var(--brown);color:#e9dcc7;position:sticky;top:0;height:100dvh;overflow:auto;display:flex;flex-direction:column}
aside .top{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:10px}
aside .top img{height:46px}
aside nav{padding:10px 0;flex:1}
aside nav button{width:100%;background:none;border:0;color:#d9c9ad;text-align:left;padding:12px 18px;cursor:pointer;
  display:flex;align-items:center;gap:11px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-left:3px solid transparent}
aside nav button i{width:18px;text-align:center;color:var(--gold)}
aside nav button:hover{background:rgba(255,255,255,.06);color:#fff}
aside nav button[aria-current="page"]{background:rgba(198,164,59,.16);color:#fff;border-left-color:var(--gold)}
aside .bottom{padding:14px 18px;border-top:1px solid rgba(255,255,255,.12);display:grid;gap:8px}
aside .bottom .btn{border-color:rgba(255,255,255,.28);color:#e9dcc7;width:100%}
aside .bottom .btn:hover{background:rgba(255,255,255,.1);color:#fff}
main{padding:24px;min-width:0}
.topbar{display:none;position:sticky;top:0;z-index:40;background:var(--brown);color:#fff;align-items:center;
  justify-content:space-between;padding:10px 14px;gap:10px}
.topbar img{height:38px}
.topbar button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;min-width:44px;min-height:44px;cursor:pointer}
@media(max-width:980px){
  .shell{grid-template-columns:1fr}
  .topbar{display:flex}
  aside{position:fixed;inset:0 auto 0 0;width:262px;z-index:70;transform:translateX(-100%);transition:.25s;height:100dvh}
  aside.open{transform:none;box-shadow:0 0 0 100vw rgba(20,12,6,.5)}
  main{padding:16px}
}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin-bottom:6px}
.head h1{font-size:clamp(24px,4vw,34px)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{background:var(--white);border:1px solid var(--line);padding:16px;position:relative;overflow:hidden}
.kpi i.ic{position:absolute;right:14px;top:14px;color:var(--gold-dark);font-size:16px}
.kpi b{font-family:'Cormorant Garamond',serif;font-size:30px;display:block;line-height:1.15}
.kpi span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.kpi .delta{font-size:11px;color:var(--green)}
.panel{background:var(--white);border:1px solid var(--line);padding:18px;margin-top:18px}
.panel h2{font-size:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1000px){.grid2,.grid3{grid-template-columns:1fr}}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap;position:sticky;top:0;background:var(--white)}
tbody tr:hover{background:var(--sand)}
.state{display:inline-flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--line);padding:5px 9px;white-space:nowrap;background:var(--white)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.g{background:var(--green);box-shadow:0 0 0 3px rgba(31,139,76,.18)}
.dot.a{background:var(--gold-dark);box-shadow:0 0 0 3px rgba(198,164,59,.2)}
.dot.r{background:var(--red);box-shadow:0 0 0 3px rgba(178,59,59,.18)}
.dot.b{background:var(--blue);box-shadow:0 0 0 3px rgba(43,95,139,.18)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.toolbar input,.toolbar select{min-width:150px;width:auto;flex:1 1 170px;max-width:320px}
.chartbox{width:100%;overflow:hidden;margin-top:10px}
.svgc{width:100%;height:auto;display:block}
.panel .chartbox .svgc{max-height:320px}
.hbar{margin:11px 0}
.hbar .track{height:9px;background:var(--sand);border:1px solid var(--line)}
.hbar .track i{display:block;height:100%}
@media(max-width:700px){.chart{height:150px}}
@media print{.side,.topbar,.btn{display:none!important}.panel{break-inside:avoid;page-break-inside:avoid}}
.chart{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:10px}
.chart .bar{flex:1;background:linear-gradient(180deg,var(--gold),var(--brown));min-height:3px;position:relative;transition:.3s}
.chart .bar span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.chart .bar b{position:absolute;top:-19px;left:0;right:0;text-align:center;font-size:10px;color:var(--brown)}
.chartwrap{padding-bottom:26px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.drop{border:2px dashed var(--line);background:var(--sand);padding:18px;text-align:center;cursor:pointer;transition:.2s}
.drop:hover,.drop.over{border-color:var(--gold);background:#f6eeda}
.drop i{font-size:20px;color:var(--gold-dark);display:block;margin-bottom:6px}
.thumbrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbrow .th{position:relative;border:1px solid var(--line);background:var(--white)}
.thumbrow .th img{width:76px;height:76px;object-fit:cover}
.thumbrow .th button{position:absolute;top:-9px;right:-9px;background:var(--red);color:#fff;border:0;width:24px;height:24px;cursor:pointer;border-radius:50%;font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(28,18,10,.62);z-index:120;display:grid;place-items:start center;padding:16px;overflow:auto}
.modal{background:var(--white);border:1px solid var(--line);max-width:840px;width:100%;margin:auto}
.modal.narrow{max-width:520px}
.modal .mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--white);z-index:3}
.modal .mbody{padding:18px}
.x{background:none;border:1px solid transparent;font-size:22px;cursor:pointer;min-width:44px;min-height:44px}
.x:hover{border-color:var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--brown);color:#fff;padding:12px 20px;z-index:300;
  font-size:13px;box-shadow:0 14px 40px -18px #000;max-width:92vw;text-align:center}
.item{border:1px solid var(--line);padding:14px;margin-bottom:12px;background:var(--white)}
.item .between{margin-bottom:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kv div span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:block}
.kv div b{word-break:break-word}
.tstep{display:grid;grid-template-columns:20px 1fr;gap:12px;position:relative;padding-bottom:16px}
.tstep .bul{width:13px;height:13px;border-radius:50%;background:var(--sand);border:2px solid var(--line);margin-top:5px;z-index:2}
.tstep.done .bul{background:var(--green);border-color:var(--green)}
.tstep.now .bul{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,139,76,.5)}70%{box-shadow:0 0 0 10px rgba(31,139,76,0)}100%{box-shadow:0 0 0 0 rgba(31,139,76,0)}}
.tstep::before{content:"";position:absolute;left:9px;top:19px;bottom:-2px;width:2px;background:var(--line)}
.tstep.done::before{background:var(--green)}
.tstep:last-child::before{display:none}
.swatch{width:26px;height:26px;border:1px solid var(--line);display:inline-block}
.badge{background:var(--brown);color:#fff;font-size:10px;padding:2px 7px;letter-spacing:.1em}
.mini{width:46px;height:46px;object-fit:cover;border:1px solid var(--line);background:var(--sand)}
</style>
</head>
<body>

<!-- ============================== LOGIN ============================== -->
<div class="login" id="loginScreen">
  <form class="box" id="loginForm">
    <img src="images/logo1.png" alt="Pluto Collections" id="loginLogo" />
    <p class="eyebrow">Owner access</p>
    <h1 style="font-size:30px">Dashboard sign in</h1>
    <div class="rule" style="margin:12px auto 18px"></div>
    <div class="field" style="text-align:left"><label for="ad_email">Email</label>
      <input id="ad_email" type="email" autocomplete="username" value="" required /></div>
    <div class="field" style="text-align:left"><label for="ad_pass">Password</label>
      <input id="ad_pass" type="password" autocomplete="current-password" required /></div>
    <p class="err" id="adErr" role="alert"></p>
    <button class="btn gold" style="width:100%"><i class="fas fa-right-to-bracket" aria-hidden="true"></i> Sign in</button>
    <p class="note" style="margin-top:14px"><a href="index.html" style="text-decoration:underline"><i class="fas fa-arrow-left"></i> Back to the store</a></p>
  </form>
</div>

<!-- ============================== APP ============================== -->
<div id="app" class="hide">
  <div class="topbar">
    <button id="menuBtn" aria-label="Open menu" aria-expanded="false"><i class="fas fa-bars" aria-hidden="true"></i></button>
    <img src="images/logo1.png" alt="Pluto Collections" id="barLogo" />
    <a class="btn sm ghost" href="index.html" target="_blank" rel="noopener" style="border-color:rgba(255,255,255,.3);color:#fff"><i class="fas fa-arrow-up-right-from-square"></i></a>
  </div>
  <div class="shell">
    <aside id="side">
      <div class="top"><img src="images/logo1.png" alt="" id="sideLogo" /><div>
        <b style="font-family:'Cormorant Garamond',serif;font-size:19px" id="sideBrand">Pluto Collections</b>
        <p class="note" style="color:#c9b795;margin:0">Owner dashboard</p></div></div>
      <nav id="sideNav" aria-label="Dashboard sections"></nav>
      <div class="bottom">
        <a class="btn sm" href="index.html" target="_blank" rel="noopener"><i class="fas fa-store" aria-hidden="true"></i> View store</a>
        <button class="btn sm" onclick="logout()"><i class="fas fa-right-from-bracket" aria-hidden="true"></i> Sign out</button>
      </div>
    </aside>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<div id="modals"></div>
<div id="live" class="sr-only" aria-live="polite"></div>

<script>
/* ===================== shared database (same key as index.html) ===================== */
const SEED_FALLBACK = { settings:{brand_name:'Pluto Collections',tagline:'Timeless Luxury · Modern Elegance',logo_url:'images/logo1.png',
  upi_id:'plutocollections@upi',payee_name:'Pluto Collections',accent_hex:'#c6a43b'}, banners:[], memberships:[], products:[] };

/* Auto-generated payment bill — every label below is editable from the admin dashboard */
const DEF_BILL = {
  enabled: true,
  title: 'Payment Bill',
  prefix: 'PB-',
  accent: '#c6a43b',
  show_logo: true,
  show_gst: true,
  show_bank: true,
  show_upi: true,
  show_tax_row: true,
  tax_label: 'GST',
  paid_stamp: 'PAID',
  declaration: 'We hereby certify that the payment referenced above has been received in full against this order. This bill is issued in accordance with the Pluto Collections payment terms.',
  terms: 'Prices are inclusive of all applicable charges shown. Tax and shipping are waived for Premium and Exclusive members. Any dispute must be raised within 7 days of the payment date quoting the transaction id printed on this bill.',
  signature_name: 'For Pluto Collections',
  signature_role: 'Authorised signatory',
  thank_you: 'Thank you for shopping with Pluto Collections.',
  footer_note: 'This is a computer-generated payment bill and is valid without a physical signature.'
};

const DBKEY = 'pluto_db_v2';
const $ = id => document.getElementById(id);
const uid = () => 'x' + Math.random().toString(36).slice(2,10);
const money = n => '₹' + Number(n||0).toLocaleString('en-IN');
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr = s => esc(s).replace(/\n/g,' ');
const fmtDate = d => new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtDay  = d => new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});

let DB = null;
function loadDB(){
  try{ const raw = localStorage.getItem(DBKEY); if(raw){ const d = JSON.parse(raw); if(d && Array.isArray(d.products)) return d; } }catch(e){}
  return null;
}
function saveDB(){ DB.updated_at = Date.now(); localStorage.setItem(DBKEY, JSON.stringify(DB)); }
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent = msg;
  document.body.appendChild(t); $('live').textContent = msg; setTimeout(()=>t.remove(), 2600);
}
window.addEventListener('storage', e=>{ if(e.key===DBKEY){ const d = loadDB(); if(d){ DB = d; if(!$('app').classList.contains('hide')) render(); } } });

/* ===================== auth ===================== */
const AUTHKEY = 'pluto_admin_session';
function checkSession(){ return localStorage.getItem(AUTHKEY) === 'ok'; }
$('loginForm').addEventListener('submit', e=>{
  e.preventDefault();
  const email = $('ad_email').value.trim().toLowerCase(), pass = $('ad_pass').value;
  const dbUser = (loadDB()?.users||[]).find(u=>u.email===email && u.role==='admin');
  const ok = (email==='admin@pluto.com' && pass==='admin123') || (dbUser && dbUser.password===pass);
  if(!ok){ $('adErr').textContent = 'Invalid owner credentials. Try admin@pluto.com / admin123'; return; }
  localStorage.setItem(AUTHKEY,'ok'); startApp();
});
function logout(){ localStorage.removeItem(AUTHKEY); location.reload(); }

/* ===================== images (drag & drop, compressed) ===================== */
function readImage(file){
  return new Promise((resolve,reject)=>{
    if(!file || !/^image\//.test(file.type)) return reject(new Error('Please drop an image file'));
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1280, sc = Math.min(1, max/Math.max(img.width,img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg', .82));
      };
      img.onerror = () => resolve(fr.result);
      img.src = fr.result;
    };
    fr.onerror = () => reject(new Error('Could not read that file'));
    fr.readAsDataURL(file);
  });
}
/* Creates a reusable drop zone. onPick(dataUrl) is called per image. */
function dropZone(id, label, onPick, multiple){
  setTimeout(()=>{
    const el = $(id); if(!el) return;
    const input = el.querySelector('input[type=file]');
    el.addEventListener('click', e=>{ if(e.target !== input) input.click(); });
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); input.click(); } });
    ['dragenter','dragover'].forEach(ev=>el.addEventListener(ev, e=>{ e.preventDefault(); el.classList.add('over'); }));
    ['dragleave','drop'].forEach(ev=>el.addEventListener(ev, e=>{ e.preventDefault(); el.classList.remove('over'); }));
    const handle = async files => {
      for(const f of [...files].slice(0, multiple?8:1)){
        try{ onPick(await readImage(f)); }catch(err){ toast(err.message); }
      }
    };
    el.addEventListener('drop', e=>handle(e.dataTransfer.files));
    input.addEventListener('change', e=>handle(e.target.files));
  },0);
  return `<div class="drop" id="${id}" tabindex="0" role="button" aria-label="${attr(label)}">
    <i class="fas fa-cloud-arrow-up" aria-hidden="true"></i>
    <b style="font-size:13px">${esc(label)}</b>
    <p class="note" style="margin:4px 0 0">Drag &amp; drop, or click to choose${multiple?' (multiple allowed)':''}</p>
    <input type="file" accept="image/*" ${multiple?'multiple':''} class="hide" />
  </div>`;
}

/* ===================== modal ===================== */
let lastFocus=null;
function openModal(html){
  lastFocus = document.activeElement;
  $('modals').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()">${html}</div>`;
  document.body.style.overflow='hidden';
  const box = $('modals').querySelector('.modal');
  if(box){ box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true'); }
  const f = $('modals').querySelector('input,select,textarea,button');
  if(f) f.focus();
}
function closeModal(){ $('modals').innerHTML=''; document.body.style.overflow=''; if(lastFocus?.focus) lastFocus.focus(); }
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && $('modals').children.length) closeModal();
  if(e.key==='Tab' && $('modals').children.length){
    const box = $('modals').querySelector('.modal'); if(!box) return;
    const items=[...box.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea')].filter(el=>el.offsetParent!==null);
    if(!items.length) return;
    const first=items[0], last=items[items.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});

/* ===================== navigation ===================== */
const SECTIONS = [
  ['overview','Overview','fas fa-chart-pie'],
  ['orders','Orders','fas fa-box'],
  ['tracking','Tracking','fas fa-truck-fast'],
  ['customers','Customers','fas fa-users'],
  ['products','Products','fas fa-shirt'],
  ['banners','Banners','fas fa-images'],
  ['navigation','Navigation bar','fas fa-bars'],
  ['pages','Pages','fas fa-file-lines'],
  ['journal','Journal','fas fa-feather'],
  ['about','About page','fas fa-circle-info'],
  ['footer','Footer','fas fa-shoe-prints'],
  ['memberships','Memberships','fas fa-crown'],
  ['benefits','Member benefits','fas fa-tags'],
  ['payments','Payments & info','fas fa-qrcode'],
  ['insights','Analysis / Insights','fas fa-chart-pie'],
  ['settings','Settings','fas fa-gear']
];
let ROUTE = 'overview';
const F = { orderQ:'', orderStatus:'all', orderPay:'all', custQ:'', prodQ:'', prodCat:'all' };

function renderNav(){
  $('sideNav').innerHTML = SECTIONS.map(([k,l,i])=>
    `<button ${ROUTE===k?'aria-current="page"':''} onclick="goTo('${k}')"><i class="${i}" aria-hidden="true"></i>${l}</button>`).join('');
}
function goTo(k){ ROUTE = k; location.hash = k; closeSide(); render(); $('view').focus(); window.scrollTo({top:0}); }
function closeSide(){ $('side').classList.remove('open'); $('menuBtn').setAttribute('aria-expanded','false'); }
$('menuBtn').addEventListener('click', ()=>{
  const open = !$('side').classList.contains('open');
  $('side').classList.toggle('open', open);
  $('menuBtn').setAttribute('aria-expanded', String(open));
});

/* ===================== helpers ===================== */
const STATUSES = ['placed','confirmed','packed','shipped','out_for_delivery','delivered','cancelled'];
const STATUS_LABEL = { placed:'Placed', confirmed:'Confirmed', packed:'Packed', shipped:'Shipped',
  out_for_delivery:'Out for delivery', delivered:'Delivered', cancelled:'Cancelled' };
const CONDITIONS = ['good','repacked','delayed','damaged','lost'];
const COND_LABEL = { good:'Good', repacked:'Repacked', delayed:'Delayed', damaged:'Damaged', lost:'Lost in transit' };
function statePill(o){
  const cls = o.status==='delivered'?'g' : o.status==='cancelled'?'r' : o.status==='shipped'||o.status==='out_for_delivery'?'b':'a';
  return `<span class="state"><span class="dot ${cls}"></span>${STATUS_LABEL[o.status]||o.status}</span>`;
}
function condPill(c){
  const cls = c==='good'?'g' : (c==='damaged'||c==='lost')?'r':'a';
  return `<span class="state"><span class="dot ${cls}"></span>${COND_LABEL[c]||c}</span>`;
}
const revenueOf = o => (o.payment_status==='verified' && o.status!=='cancelled') ? o.total : 0;
const customers = () => DB.users.filter(u=>u.role!=='admin');
function head(title, sub, actions){
  return `<div class="head"><div style="min-width:0"><p class="eyebrow">${esc(sub||'')}</p><h1>${esc(title)}</h1></div>
    <div class="row">${actions||''}</div></div><div class="rule"></div>`;
}

/* ===================== router ===================== */
function render(){
  renderNav();
  const v = $('view');
  const map = { overview:viewOverview, orders:viewOrders, tracking:viewTracking, customers:viewCustomers,
    products:viewProducts, banners:viewBanners, navigation:viewNavigation, pages:viewPages,
    journal:viewJournal, about:viewAbout, footer:viewFooter,
    memberships:viewMemberships, benefits:viewBenefits, payments:viewPayments, insights:viewInsights, settings:viewSettings };
  v.innerHTML = (map[ROUTE] || viewOverview)();
  if(ROUTE==='overview') drawChart();
}

/* ===================== overview ===================== */
function last7(){
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    const nxt = new Date(d); nxt.setDate(d.getDate()+1);
    const os = DB.orders.filter(o=>{ const t=new Date(o.created_at); return t>=d && t<nxt; });
    days.push({ label:d.toLocaleDateString('en-IN',{weekday:'short'}), orders:os.length, revenue:os.reduce((a,o)=>a+revenueOf(o),0) });
  }
  return days;
}
function viewOverview(){
  const os = DB.orders, rev = os.reduce((a,o)=>a+revenueOf(o),0);
  const pending = os.filter(o=>o.payment_status==='pending').length;
  const live = os.filter(o=>!['delivered','cancelled'].includes(o.status)).length;
  const members = customers().filter(u=>u.membership?.status==='active');
  const memRev = members.reduce((a,u)=>a+Number(u.membership.price||0),0);
  const aov = os.length ? Math.round(rev / Math.max(1, os.filter(o=>revenueOf(o)>0).length)) : 0;
  const recent = os.slice(0,7);
  const lowStock = DB.products.filter(p=>/limited|pre-order|out/i.test(p.stock||''));
  return `${head('Business overview','Dashboard', `<button class="btn sm" onclick="goTo('orders')"><i class="fas fa-box"></i> Orders</button>
    <button class="btn sm gold" onclick="openProduct()"><i class="fas fa-plus"></i> New product</button>`)}
  <div class="cards">
    <div class="kpi"><i class="fas fa-indian-rupee-sign ic"></i><span>Revenue (verified)</span><b>${money(rev)}</b><p class="delta">+${money(memRev)} membership</p></div>
    <div class="kpi"><i class="fas fa-box ic"></i><span>Total orders</span><b>${os.length}</b><p class="note">${live} in progress</p></div>
    <div class="kpi"><i class="fas fa-hourglass-half ic"></i><span>Pending payments</span><b>${pending}</b><p class="note">COD awaiting collection</p></div>
    <div class="kpi"><i class="fas fa-users ic"></i><span>Customers</span><b>${customers().length}</b><p class="note">${members.length} active members</p></div>
    <div class="kpi"><i class="fas fa-receipt ic"></i><span>Average order</span><b>${money(aov)}</b><p class="note">per verified order</p></div>
    <div class="kpi"><i class="fas fa-shirt ic"></i><span>Live products</span><b>${DB.products.filter(p=>p.active!==false).length}</b><p class="note">of ${DB.products.length} total</p></div>
  </div>

  <div class="grid2">
    <div class="panel">
      <div class="between"><h2>Last 7 days</h2><span class="note">Revenue &amp; orders</span></div>
      <div class="chartwrap"><div class="chart" id="chart" role="img" aria-label="Revenue for the last seven days"></div></div>
      <div class="legend"><span><i class="fas fa-square" style="color:var(--gold)"></i> Daily revenue</span>
      <span><i class="fas fa-square" style="color:var(--brown)"></i> Order volume</span></div>
    </div>
    <div class="panel">
      <div class="between"><h2>Needs attention</h2></div>
      ${pending?`<p class="note"><span class="dot a"></span> ${pending} order(s) awaiting payment collection.</p>`:''}
      ${os.filter(o=>o.status==='placed').length?`<p class="note"><span class="dot a"></span> ${os.filter(o=>o.status==='placed').length} new order(s) to confirm.</p>`:''}
      ${lowStock.length?`<p class="note"><span class="dot r"></span> ${lowStock.length} product(s) limited / pre-order / sold out.</p>`:''}
      ${!pending && !lowStock.length && !os.filter(o=>o.status==='placed').length ? '<p class="note">Everything is on track. Nice work.</p>':''}
      <div class="tablewrap" style="margin-top:10px"><table style="min-width:420px"><caption class="sr-only">Stock alerts</caption>
        <thead><tr><th>Product</th><th>Stock</th><th>Price</th></tr></thead>
        <tbody>${lowStock.slice(0,6).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.stock)}</td><td>${money(p.discounted)}</td></tr>`).join('') || '<tr><td colspan="3" class="note">All products in stock</td></tr>'}</tbody>
      </table></div>
    </div>
  </div>

  <div class="panel">
    <div class="between"><h2>Recent orders</h2><button class="btn sm ghost" onclick="goTo('orders')">View all</button></div>
    <div class="tablewrap"><table>
      <thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Placed</th><th></th></tr></thead>
      <tbody>${recent.map(o=>`<tr>
        <td><b>${esc(o.order_no)}</b></td><td>${esc(o.customer_name)}<br><span class="note">${esc(o.phone)}</span></td>
        <td><b>${money(o.total)}</b></td>
        <td><span class="state"><span class="dot ${o.payment_status==='verified'?'g':'a'}"></span>${esc(o.payment_status)}</span></td>
        <td>${statePill(o)}</td><td class="note">${fmtDay(o.created_at)}</td>
        <td><button class="btn sm" onclick="openOrder('${o.id}')"><i class="fas fa-eye"></i></button></td></tr>`).join('')
        || '<tr><td colspan="7" class="note">No orders yet. Orders placed on the store appear here instantly.</td></tr>'}</tbody>
    </table></div>
  </div>`;
}
function drawChart(){
  const el = $('chart'); if(!el) return;
  const d = last7(), max = Math.max(1, ...d.map(x=>x.revenue));
  el.innerHTML = d.map(x=>`<div class="bar" style="height:${Math.max(3,(x.revenue/max)*100)}%" title="${x.label}: ${money(x.revenue)} · ${x.orders} orders">
    <b>${x.orders?money(x.revenue):''}</b><span>${x.label}</span></div>`).join('');
}

const TRACK_STEPS = [['placed','Order placed'],['confirmed','Confirmed'],['packed','Packed at studio'],
  ['shipped','Shipped'],['out_for_delivery','Out for delivery'],['delivered','Delivered']];
function trackerHTML(o){
  if(o.status==='cancelled') return `<p class="note">Order cancelled${o.cancelled_at?' on '+fmtDay(o.cancelled_at):''}.</p>`;
  const idx = TRACK_STEPS.findIndex(s=>s[0]===o.status);
  const hist = o.tracking?.history || [];
  return `<div style="margin-top:10px">${TRACK_STEPS.map(([k,l],i)=>{
    const done = i<idx, now = i===idx, h = hist.slice().reverse().find(x=>x.step===k);
    return `<div class="tstep ${done||now?'done':''} ${now?'now':''}"><span class="bul"></span>
      <div><b>${l}</b><p class="note">${h?esc(h.place||'')+(h.note?' · '+esc(h.note):'')+' · '+fmtDate(h.at):(done||now?'Reached':'Pending')}</p></div></div>`;
  }).join('')}</div>`;
}
function saveOrder(e, id){
  e.preventDefault();
  const f = new FormData(e.target), o = DB.orders.find(x=>x.id===id);
  const prev = o.status;
  o.status = f.get('status'); o.payment_status = f.get('payment_status');
  o.tracking = o.tracking || { history: [] };
  o.tracking.condition = f.get('condition');
  o.tracking.location = f.get('location');
  o.tracking.courier = f.get('courier');
  o.tracking.awb = f.get('awb');
  if(o.status==='cancelled') o.cancelled_at = new Date().toISOString();
  o.tracking.history = [...(o.tracking.history||[]), {
    step:o.status, place:f.get('location')||'', note:f.get('note')||(prev!==o.status?('Marked '+(STATUS_LABEL[o.status]||o.status)):'Details updated'),
    at:new Date().toISOString() }];
  saveDB(); closeModal(); toast('Order '+o.order_no+' updated'); render();
}
function deleteOrder(id){
  const o = DB.orders.find(x=>x.id===id);
  if(!confirm('Delete order '+o.order_no+' permanently?')) return;
  DB.orders = DB.orders.filter(x=>x.id!==id); saveDB(); closeModal(); toast('Order deleted'); render();
}
function exportOrders(){
  const rows = [['Order','Date','Customer','Phone','Email','City','Pincode','Items','Total','Payment','UTR','Status','Condition','Location']];
  DB.orders.forEach(o=>rows.push([o.order_no,fmtDay(o.created_at),o.customer_name,o.phone,o.email,o.city,o.pincode,
    o.items.map(i=>i.name+' x'+i.qty).join(' | '),o.total,o.payment_method+'/'+o.payment_status,o.utr,o.status,
    o.tracking?.condition||'',o.tracking?.location||'']));
  const csv = rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = 'pluto-orders-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  toast('Orders exported');
}

function exportCustomers(){

      u.membership?.plan||'',os.length,os.reduce((a,o)=>a+revenueOf(o),0),fmtDay(u.created_at)]);

function currentFormValues(){
  const f = $('pForm'); if(!f) return {};
  const d = Object.fromEntries(new FormData(f).entries());
  d.sizes = String(d.sizes||'').split(',').map(s=>s.trim()).filter(Boolean);
  d.active = !!f.querySelector('[name=active]').checked;
  return d;
}
function removeImg(i){ const v = currentFormValues(); PFORM.images.splice(i,1); paintProductForm(v); }
function addImgUrl(){ const u = $('pf_url').value.trim(); if(!u) return; const v = currentFormValues(); PFORM.images.push(u); paintProductForm(v); }
function saveProduct(e){
  e.preventDefault();
  const f = new FormData(e.target);
  if(!PFORM.images.length){ toast('Add at least one image'); return; }
  const data = {
    name:String(f.get('name')).trim(), brand:String(f.get('brand')).trim(), category:String(f.get('category')).trim(),
    original:Number(f.get('original')), discounted:Number(f.get('discounted')),
    color:String(f.get('color')||''), color_hex:String(f.get('color_hex')||'#c6a43b'),
    sizes:String(f.get('sizes')||'').split(',').map(s=>s.trim()).filter(Boolean),
    material:String(f.get('material')||''), features:String(f.get('features')||''),
    care:String(f.get('care')||''), fit:String(f.get('fit')||''), description:String(f.get('description')||''),
    stock:String(f.get('stock')), sort_order:Number(f.get('sort_order')||0),
    active: e.target.querySelector('[name=active]').checked,
    images:[...PFORM.images], img:PFORM.images[0]
  };
  if(data.discounted > data.original){ toast('Selling price cannot exceed the original price'); return; }
  if(PFORM.id){ const i = DB.products.findIndex(x=>x.id===PFORM.id); DB.products[i] = { ...DB.products[i], ...data }; }
  else DB.products.push({ id:uid(), ...data });
  saveDB(); closeModal(); toast('Product saved — the store is updated'); render();
}

const upPage = (id,k,v)=>{ const p = DB.pages.find(x=>x.id===id); if(!p) return; p[k]=v; saveDB(); toast('Page saved'); };
function addPage(){
  DB.pages = DB.pages||[];
  const n = DB.pages.length+1;
  DB.pages.push({ id:uid(), title:'New page '+n, slug:'new-page-'+n, eyebrow:'Pluto Collections',
    intro:'Write the opening paragraph of this page here.', hero_img:'', active:true,
    blocks:[{ id:uid(), icon:'fas fa-star', title:'First section', text:'Describe this section.' }] });
  saveDB(); toast('Page created'); render();
}
function delPage(id){ if(!confirm('Delete this page? Any navigation tab pointing at it will stop working.')) return;
  DB.pages = DB.pages.filter(p=>p.id!==id); saveDB(); render(); }
function addPageBlock(id){ const p = DB.pages.find(x=>x.id===id);
  p.blocks = [...(p.blocks||[]), { id:uid(), icon:'fas fa-star', title:'New section', text:'Describe this section.' }];
  saveDB(); render(); }
const upPageBlock = (pid,bid,k,v)=>{ const p = DB.pages.find(x=>x.id===pid); const b=(p.blocks||[]).find(x=>x.id===bid);
  if(!b) return; b[k]=v; saveDB(); toast('Section saved'); };
function delPageBlock(pid,bid){ const p = DB.pages.find(x=>x.id===pid);
  p.blocks = (p.blocks||[]).filter(b=>b.id!==bid); saveDB(); render(); }
function addPageToNav(id){
  const p = DB.pages.find(x=>x.id===id); if(!p) return;
  DB.nav = DB.nav||[];
  const href = '#/page/'+p.slug;
  if(DB.nav.some(n=>n.href===href)) return toast('That page is already a tab');
  DB.nav.push({ id:uid(), label:p.title, icon:'fas fa-file-lines', href, active:true, sort_order:DB.nav.length+1 });
  saveDB(); toast('Added to the navigation bar'); goTo('navigation');
}

function planPerkLines(m){
  const out = [];
  if(Number(m.discount_pct||0) > 0) out.push(Number(m.discount_pct)+'% off every product price');

  if(m.priority_dispatch) out.push('Priority dispatch from the studio');
  if(m.early_access)      out.push('Early access to new drops');
  return out;
}

/* ===================== analysis & insights ===================== */
const AN = { range:90 };
const CH_COLORS = ['#c6a43b','#3a2415','#9a7c26','#2b5f8b','#1f8b4c','#b23b3b','#7d5a9c','#c07c3e'];

function anDays(n){
  const out=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    const nxt=new Date(d); nxt.setDate(d.getDate()+1);
    const os=DB.orders.filter(o=>{const t=new Date(o.created_at); return t>=d && t<nxt;});
    out.push({ date:d, label:d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}),
      orders:os.length, revenue:os.reduce((a,o)=>a+revenueOf(o),0),
      units:os.reduce((a,o)=>a+(o.items||[]).reduce((x,i)=>x+i.qty,0),0) });
  }
  return out;
}
function anWeeks(days, size){
  const out=[]; size = size||7;
  for(let i=0;i<days.length;i+=size){
    const chunk = days.slice(i,i+size); if(!chunk.length) continue;
    const vals = chunk.map(d=>d.revenue);
    out.push({ label:chunk[0].label, open:vals[0], close:vals[vals.length-1],
      high:Math.max(...vals), low:Math.min(...vals),
      total:vals.reduce((a,b)=>a+b,0), orders:chunk.reduce((a,d)=>a+d.orders,0) });
  }
  return out;
}
const anNice = v => v>=1e7?(v/1e7).toFixed(1)+'Cr' : v>=1e5?(v/1e5).toFixed(1)+'L' : v>=1000?(v/1000).toFixed(1)+'k' : Math.round(v);

/* --- generic svg scaffolding --- */
function anFrame(inner, opts){
  const o = Object.assign({w:640,h:280,label:''}, opts||{});
  return `<div class="chartbox"><svg viewBox="0 0 ${o.w} ${o.h}" preserveAspectRatio="xMidYMid meet" role="img"
    style="aspect-ratio:${o.w}/${o.h}"
    aria-label="${esc(o.label)}" class="svgc">${inner}</svg></div>`;
}
function anGrid(w,h,pad,max,rows){
  rows = rows||4; let g='';
  for(let i=0;i<=rows;i++){
    const y = pad.t + (h-pad.t-pad.b)*(i/rows);
    const v = max*(1-i/rows);
    g += `<line x1="${pad.l}" x2="${w-pad.r}" y1="${y}" y2="${y}" stroke="#ddd0ba" stroke-width="1"/>
      <text x="${pad.l-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#6d5c4a">${anNice(v)}</text>`;
  }
  return g;
}
function anXLabels(items,w,h,pad,every){
  const n=items.length, iw=(w-pad.l-pad.r)/Math.max(1,n);
  every = every || Math.ceil(n/8);
  return items.map((it,i)=> i%every===0 || i===n-1
    ? `<text x="${pad.l+iw*(i+.5)}" y="${h-pad.b+16}" text-anchor="middle" font-size="10" fill="#6d5c4a">${esc(it.label)}</text>`
    : '').join('');
}

/* --- mountain (area) chart --- */
function chartMountain(days){
  const w=640,h=280,pad={l:46,r:14,t:16,b:30};
  const max=Math.max(1,...days.map(d=>d.revenue));
  const n=days.length, iw=(w-pad.l-pad.r)/Math.max(1,n-1);
  const pts=days.map((d,i)=>[pad.l+iw*i, pad.t+(h-pad.t-pad.b)*(1-d.revenue/max)]);
  const line=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area=`${line} L${(w-pad.r).toFixed(1)},${h-pad.b} L${pad.l},${h-pad.b} Z`;
  return anFrame(`
    <defs><linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c6a43b" stop-opacity=".75"/><stop offset="100%" stop-color="#c6a43b" stop-opacity=".05"/>
    </linearGradient></defs>
    ${anGrid(w,h,pad,max)}
    <path d="${area}" fill="url(#mtn)"/>
    <path d="${line}" fill="none" stroke="#9a7c26" stroke-width="2.2" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="#3a2415"><title>${esc(days[i].label)}: ${money(days[i].revenue)}</title></circle>`).join('')}
    ${anXLabels(days,w,h,pad)}`, {w,h,label:'Daily revenue mountain chart'});
}

/* --- line chart (multi series) --- */
function chartLine(days){
  const w=640,h=280,pad={l:46,r:14,t:16,b:30};
  const maxO=Math.max(1,...days.map(d=>d.orders)), maxU=Math.max(1,...days.map(d=>d.units));
  const max=Math.max(maxO,maxU);
  const n=days.length, iw=(w-pad.l-pad.r)/Math.max(1,n-1);
  const path=(key,col)=>{
    const d=days.map((x,i)=>`${i?'L':'M'}${(pad.l+iw*i).toFixed(1)},${(pad.t+(h-pad.t-pad.b)*(1-x[key]/max)).toFixed(1)}`).join(' ');
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  };
  return anFrame(`${anGrid(w,h,pad,max)}${path('orders','#3a2415')}${path('units','#c6a43b')}${anXLabels(days,w,h,pad)}`,
    {w,h,label:'Orders and units sold line chart'});
}

/* --- candlestick chart --- */
function chartCandle(weeks){
  const w=640,h=280,pad={l:46,r:14,t:16,b:30};
  const max=Math.max(1,...weeks.map(x=>x.high)), n=weeks.length;
  const iw=(w-pad.l-pad.r)/Math.max(1,n), bw=Math.min(26,iw*.5);
  const y=v=>pad.t+(h-pad.t-pad.b)*(1-v/max);
  const body=weeks.map((c,i)=>{
    const cx=pad.l+iw*(i+.5), up=c.close>=c.open, col=up?'#1f8b4c':'#b23b3b';
    const top=y(Math.max(c.open,c.close)), bot=y(Math.min(c.open,c.close));
    return `<g><line x1="${cx}" x2="${cx}" y1="${y(c.high)}" y2="${y(c.low)}" stroke="${col}" stroke-width="1.6"/>
      <rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${Math.max(2,bot-top)}" fill="${up?col:'#fff'}" stroke="${col}" stroke-width="1.6"/>
      <title>${esc(c.label)} · open ${money(c.open)} · high ${money(c.high)} · low ${money(c.low)} · close ${money(c.close)}</title></g>`;
  }).join('');
  return anFrame(`${anGrid(w,h,pad,max)}${body}${anXLabels(weeks,w,h,pad,1)}`,{w,h,label:'Weekly revenue candlestick chart'});
}

/* --- range chart (floating bars low-high) --- */
function chartRange(weeks){
  const w=640,h=280,pad={l:46,r:14,t:16,b:30};
  const max=Math.max(1,...weeks.map(x=>x.high)), n=weeks.length;
  const iw=(w-pad.l-pad.r)/Math.max(1,n), bw=Math.min(34,iw*.55);
  const y=v=>pad.t+(h-pad.t-pad.b)*(1-v/max);
  const bars=weeks.map((c,i)=>{
    const cx=pad.l+iw*(i+.5), avg=c.orders?c.total/Math.max(1,c.orders):0;
    return `<g><rect x="${cx-bw/2}" y="${y(c.high)}" width="${bw}" height="${Math.max(3,y(c.low)-y(c.high))}"
      rx="3" fill="url(#rng)"/>
      <line x1="${cx-bw/2}" x2="${cx+bw/2}" y1="${y(avg)}" y2="${y(avg)}" stroke="#3a2415" stroke-width="1.8"/>
      <title>${esc(c.label)} · low ${money(c.low)} – high ${money(c.high)} · avg order ${money(Math.round(avg))}</title></g>`;
  }).join('');
  return anFrame(`<defs><linearGradient id="rng" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#c6a43b"/><stop offset="100%" stop-color="#3a2415"/></linearGradient></defs>
    ${anGrid(w,h,pad,max)}${bars}${anXLabels(weeks,w,h,pad,1)}`,{w,h,label:'Weekly revenue range chart'});
}

/* --- pie / donut chart --- */
function chartPie(entries, opts){
  const o=Object.assign({donut:false,label:'Pie chart'},opts||{});
  const total=entries.reduce((a,e)=>a+e[1],0);
  if(!total) return `<p class="note">No data yet.</p>`;
  const w=440,h=260,cx=130,cy=130,R=104,r=o.donut?58:0;
  let ang=-Math.PI/2, seg='';
  entries.forEach((e,i)=>{
    const frac=e[1]/total, a2=ang+frac*Math.PI*2, col=CH_COLORS[i%CH_COLORS.length];
    const P=(rad,a)=>[(cx+rad*Math.cos(a)).toFixed(2),(cy+rad*Math.sin(a)).toFixed(2)];
    const big=frac>.5?1:0;
    if(frac>=0.9999){
      seg+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="${col}"/>${r?`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fffdf9"/>`:''}`;
    } else {
      const [x1,y1]=P(R,ang),[x2,y2]=P(R,a2),[x3,y3]=P(r,a2),[x4,y4]=P(r,ang);
      seg+=`<path d="M${x1},${y1} A${R},${R} 0 ${big} 1 ${x2},${y2} L${x3},${y3} ${r?`A${r},${r} 0 ${big} 0 ${x4},${y4}`:''} Z"
        fill="${col}" stroke="#fffdf9" stroke-width="1.5"><title>${esc(e[0])}: ${money(e[1])} (${Math.round(frac*100)}%)</title></path>`;
    }
    ang=a2;
  });
  const legend=entries.map((e,i)=>`<g transform="translate(268,${28+i*26})">
    <rect width="13" height="13" y="-10" fill="${CH_COLORS[i%CH_COLORS.length]}"/>
    <text x="20" y="0" font-size="12" fill="#20160e">${esc(String(e[0]).slice(0,16))}</text>
    <text x="20" y="14" font-size="10" fill="#6d5c4a">${money(e[1])} · ${Math.round(e[1]/total*100)}%</text></g>`).join('');
  return anFrame(`${seg}${legend}${o.donut?`<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="13" fill="#6d5c4a">Total</text>
    <text x="${cx}" y="${cy+18}" text-anchor="middle" font-family="Cormorant Garamond,serif" font-size="20" fill="#3a2415">${money(total)}</text>`:''}`,
    {w,h,label:o.label});
}

/* --- horizontal bars --- */
function chartHBars(entries, fmt){
  const max=Math.max(1,...entries.map(e=>e[1]));
  return entries.map((e,i)=>`<div class="hbar">
    <div class="between"><span>${esc(e[0])}</span><b>${(fmt||money)(e[1])}</b></div>
    <div class="track"><i style="width:${(e[1]/max)*100}%;background:linear-gradient(90deg,${CH_COLORS[i%CH_COLORS.length]},#3a2415)"></i></div>
  </div>`).join('') || '<p class="note">No data yet.</p>';
}

function viewInsights(){
  const valid = DB.orders.filter(o=>o.status!=='cancelled');
  const days = anDays(AN.range);
  const weeks = anWeeks(days, AN.range>60?14:7);

  /* product analytics */
  const prod = {};
  DB.products.forEach(p=>{ prod[p.name]={qty:0,rev:0,cat:p.category||'Other',stock:p.stock||'—',price:p.discounted,active:p.active!==false}; });
  valid.forEach(o=>(o.items||[]).forEach(i=>{
    const k=i.name; if(!prod[k]) prod[k]={qty:0,rev:0,cat:(DB.products.find(x=>x.id===i.product_id)||{}).category||'Other',stock:'—',price:i.price,active:true};
    prod[k].qty+=i.qty; prod[k].rev+=i.price*i.qty;
  }));
  const prodRows=Object.entries(prod).sort((a,b)=>b[1].rev-a[1].rev);
  const topRev=prodRows.filter(r=>r[1].rev>0).slice(0,8).map(r=>[r[0],r[1].rev]);
  const topQty=prodRows.filter(r=>r[1].qty>0).sort((a,b)=>b[1].qty-a[1].qty).slice(0,8).map(r=>[r[0],r[1].qty]);
  const byCat={}; prodRows.forEach(([,v])=>{ if(v.rev>0) byCat[v.cat]=(byCat[v.cat]||0)+v.rev; });
  const prodRev=prodRows.reduce((a,r)=>a+r[1].rev,0);
  const units=prodRows.reduce((a,r)=>a+r[1].qty,0);

  /* membership analytics */
  const cust=customers();
  const mems=cust.filter(u=>u.membership?.status==='active');

  const planRev=Object.entries(byPlan).map(([k,v])=>[k,v.rev]).sort((a,b)=>b[1]-a[1]);
  const planCnt=Object.entries(byPlan).map(([k,v])=>[k,v.n]).sort((a,b)=>b[1]-a[1]);

  /* headline numbers */

  const cancelled=DB.orders.filter(o=>o.status==='cancelled').length;
  const codShare=DB.orders.length?Math.round(DB.orders.filter(o=>o.payment_method==='cod').length/DB.orders.length*100):0;
  const repeat=cust.filter(u=>DB.orders.filter(o=>o.user_id===u.id).length>1).length;
  const pending=DB.orders.filter(o=>o.payment_status==='pending').reduce((a,o)=>a+o.total,0);

  const byCity={}; valid.forEach(o=>{ const c=(o.city||'Unknown').trim()||'Unknown'; byCity[c]=(byCity[c]||0)+o.total; });
  const cities=Object.entries(byCity).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const stockGroups={}; DB.products.forEach(p=>{ const s=(p.stock||'—').trim(); stockGroups[s]=(stockGroups[s]||0)+1; });
  const payMix=[['UPI / prepaid',DB.orders.filter(o=>o.payment_method!=='cod').length],['Cash on delivery',DB.orders.filter(o=>o.payment_method==='cod').length]].filter(e=>e[1]>0);
  const statusMix=STATUSES.map(s=>[STATUS_LABEL[s],DB.orders.filter(o=>o.status===s).length]).filter(e=>e[1]>0);
  const bestDay=[...days].sort((a,b)=>b.revenue-a.revenue)[0];

  return `${head('Analysis & insights','Business intelligence',
    `<select aria-label="Date range" style="max-width:190px" onchange="anSetRange(this.value)">
      ${[[30,'Last 30 days'],[90,'Last 90 days'],[180,'Last 6 months'],[365,'Last 12 months']].map(([v,l])=>

    <button class="btn sm ghost" onclick="window.print()"><i class="fas fa-print"></i> Print</button>`)}

  <div class="cards">
    <div class="kpi"><i class="fas fa-indian-rupee-sign ic"></i><span>Total revenue</span><b>${money(verified+memRev)}</b><p class="delta">verified products ${money(verified)} + members ${money(memRev)}</p></div>
    <div class="kpi"><i class="fas fa-box ic"></i><span>Product revenue</span><b>${money(verified)}</b><p class="note">${paidOrders} verified orders</p></div>
    <div class="kpi"><i class="fas fa-crown ic"></i><span>Membership revenue</span><b>${money(memRev)}</b><p class="note">${mems.length} active members</p></div>
    <div class="kpi"><i class="fas fa-boxes-stacked ic"></i><span>Units sold</span><b>${units}</b><p class="note">${DB.products.length} products in catalogue</p></div>
    <div class="kpi"><i class="fas fa-receipt ic"></i><span>Average order</span><b>${money(aov)}</b><p class="note">per verified order</p></div>
    <div class="kpi"><i class="fas fa-star ic"></i><span>Top membership</span><b style="font-size:24px">${esc(bestPlan)}</b><p class="note">${planCnt[0]?planCnt[0][1]+' subscriber(s)':'no members yet'}</p></div>
    <div class="kpi"><i class="fas fa-repeat ic"></i><span>Repeat customers</span><b>${repeat}</b><p class="note">of ${cust.length} customers</p></div>
    <div class="kpi"><i class="fas fa-hourglass-half ic"></i><span>Pending collection</span><b>${money(pending)}</b><p class="note">COD awaiting payment</p></div>
    <div class="kpi"><i class="fas fa-money-bill-wave ic"></i><span>COD share</span><b>${codShare}%</b><p class="note">${100-codShare}% prepaid</p></div>
    <div class="kpi"><i class="fas fa-ban ic"></i><span>Cancellations</span><b>${cancelled}</b><p class="note">of ${DB.orders.length} orders</p></div>
  </div>

  <div class="panel">
    <div class="between"><h2>Revenue trend — mountain chart</h2>
      <span class="note">${AN.range} days · best day ${bestDay?esc(bestDay.label)+' · '+money(bestDay.revenue):'—'}</span></div>
    ${chartMountain(days)}
    <div class="legend"><span><i class="fas fa-square" style="color:var(--gold)"></i> Verified daily revenue</span></div>
  </div>

  <div class="grid2">
    <div class="panel"><h2>Orders &amp; units — line chart</h2>
      ${chartLine(days)}
      <div class="legend"><span><i class="fas fa-square" style="color:var(--brown)"></i> Orders</span>
        <span><i class="fas fa-square" style="color:var(--gold)"></i> Units sold</span></div>
    </div>
    <div class="panel"><h2>Revenue volatility — candle chart</h2>
      ${chartCandle(weeks)}
      <div class="legend"><span><i class="fas fa-square" style="color:var(--green)"></i> Period closed up</span>
        <span><i class="fas fa-square" style="color:var(--red)"></i> Period closed down</span>
        <span class="note">open / high / low / close of daily revenue</span></div>
    </div>
    <div class="panel"><h2>Low–high range chart</h2>
      ${chartRange(weeks)}

    </div>
    <div class="panel"><h2>Revenue by category — pie</h2>
      ${chartPie(Object.entries(byCat).sort((a,b)=>b[1]-a[1]), {label:'Revenue by category'})}

      <h2 style="margin-top:16px">Stock status spread</h2>

    </div>
  </div>

  <div class="panel">
    <div class="between"><h2>Product performance</h2><span class="note">Units sold, revenue and stock left</span></div>
    <div class="tablewrap"><table style="min-width:720px">
      <caption class="sr-only">Product performance</caption>
      <thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Units sold</th><th>Revenue</th><th>Share</th><th>Stock left</th><th>Status</th></tr></thead>
      <tbody>${prodRows.map(([n,v])=>`<tr>
        <td><b>${esc(n)}</b></td><td>${esc(v.cat)}</td><td>${money(v.price||0)}</td>
        <td>${v.qty}</td><td><b>${money(v.rev)}</b></td>

    </table></div>
  </div>

  <div class="panel">

function saveAdmin(e){
  e.preventDefault();
  const u = DB.users.find(x=>x.role==='admin');
  u.email = $('sa_email').value.trim().toLowerCase();
  if($('sa_pass').value) u.password = $('sa_pass').value;
  saveDB(); toast('Owner credentials updated');
}
function exportDB(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}));
  a.download = 'pluto-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); toast('Backup downloaded');
}
function importDB(file){
  if(!file) return;
  const fr = new FileReader();
  fr.onload = () => { try{ const d = JSON.parse(fr.result);
      if(!Array.isArray(d.products)) throw new Error('bad file');
      DB = d; saveDB(); toast('Backup restored'); render();
    }catch(e){ toast('That file is not a valid Pluto backup'); } };
  fr.readAsText(file);
}
function resetDB(){
  if(!confirm('Reset every product, order, customer and content block to the demo defaults?')) return;
  localStorage.removeItem(DBKEY); location.reload();
}
function paintBrand(){
  $('sideBrand').textContent = DB.settings.brand_name;
  ['sideLogo','barLogo','loginLogo'].forEach(i=>{ const el=$(i); if(el) el.src = DB.settings.logo_url||'images/logo1.png'; });
  document.documentElement.style.setProperty('--gold', DB.settings.accent_hex||'#c6a43b');
}


/* ------------------------------ auto-generated payment bill ------------------------------ */
function billData(kind, data){
  const isOrder = kind === 'order';
  const sub  = isOrder ? Number(data.subtotal ?? data.total ?? 0) : Number(data.price||0);
  const tax  = isOrder ? Number(data.tax || 0) : 0;
  const ship = isOrder ? Number(data.shipping || 0) : 0;
  const total= isOrder ? Number(data.total ?? (sub+tax+ship)) : Number(data.price||0);
  return { isOrder, sub, tax, ship, total,
    no:   (DB.bill?.prefix || 'PB-') + (isOrder ? String(data.order_no||'') : 'MEM' + String(data.utr||'').slice(-6)),
    when: isOrder ? data.created_at : data.since,
    name: isOrder ? data.customer_name : (data.user_name||''),
    email:isOrder ? data.email : (data.user_email||''),
    phone:isOrder ? data.phone : (data.user_phone||''),
    addr: isOrder ? [data.address, data.city, data.pincode].filter(Boolean).join(', ') : '',
    utr:  data.utr || '',
    method: isOrder ? (data.payment_method==='upi' ? 'UPI / QR' : 'Cash on delivery') : 'UPI / QR',
    paid: isOrder ? (data.payment_status === 'verified') : true,
    lines: isOrder
      ? (data.items||[]).map(i=>({ d: i.name + (i.size ? ' · Size ' + i.size : ''), q:i.qty, r:i.price, a:i.price*i.qty }))
      : [{ d: (data.plan||'') + ' membership · 12 months', q:1, r:Number(data.price||0), a:Number(data.price||0) }]
  };
}

<script>
function dlHTML(){
  var blob = new Blob(['<!doctype html>' + document.documentElement.outerHTML], {type:'text/html'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = ${JSON.stringify(fileName)};
  document.body.appendChild(a); a.click(); a.remove();
}
<\/script>
</body></html>`;

function openBill(ref){
  let html;
  if(String(ref).startsWith('mem:')){
    const u = DB.users.find(x=>x.id===String(ref).slice(4));
    if(!u || !u.membership) return toast('No membership found');
    html = billHTML('mem', { ...u.membership, user_name:u.full_name, user_email:u.email, user_phone:u.phone });
  } else {
    const o = DB.orders.find(x=>x.id===ref);
    if(!o) return toast('Order not found');
    html = billHTML('order', o);
  }
  const w = window.open('', '_blank');
  if(!w){ toast('Allow pop-ups to open the payment bill'); return; }
  w.document.write(html); w.document.close();
}

  <title>Receipt ${esc(no)} — ${esc(s.brand_name)}</title><style>
  *{box-sizing:border-box}body{font-family:Karla,Segoe UI,system-ui,sans-serif;color:#20160e;background:#efe7d8;margin:0;padding:24px}

function openReceipt(ref){

function openMemberCard(userId){

/* ===================== boot ===================== */
function startApp(){
  DB = loadDB();
  if(!DB){
    $('loginScreen').classList.add('hide'); $('app').classList.remove('hide');
    $('view').innerHTML = `<div class="panel"><h2>Store data not initialised</h2>
      <p class="note">Open <a href="index.html" style="text-decoration:underline">index.html</a> once so the shared store database is created,
      then reload this dashboard.</p></div>`;
    return;
  }
  /* backfill newer structures for databases created by an older build */
  if(!Array.isArray(DB.nav) || !DB.nav.length){
    DB.nav = [
      { id:uid(), label:'Home',        icon:'fas fa-house',       href:'#/',            active:true, sort_order:1 },
      { id:uid(), label:'Collections', icon:'fas fa-box-open',    href:'#/collections', active:true, sort_order:2 },
      { id:uid(), label:'About',       icon:'fas fa-circle-info', href:'#/about',       active:true, sort_order:3 }
    ];
  }
  if(!Array.isArray(DB.pages)) DB.pages = [];
  const DEFP = { Basic:{discount_pct:5}, Premium:{discount_pct:10,free_shipping:true,priority_dispatch:true,early_access:true},
                 Exclusive:{discount_pct:15,free_shipping:true,priority_dispatch:true,early_access:true} };
  DB.memberships = (DB.memberships||[]).map(m=>({ discount_pct:0, free_shipping:false, priority_dispatch:false,
    early_access:false, ...(m.discount_pct===undefined?(DEFP[m.name]||{}):{}), ...m,
    ...(m.discount_pct===undefined?(DEFP[m.name]||{}):{}) }));
  saveDB();
  $('loginScreen').classList.add('hide'); $('app').classList.remove('hide');
  paintBrand();
  ROUTE = (location.hash.slice(1) || 'overview');
  if(!SECTIONS.some(s=>s[0]===ROUTE)) ROUTE = 'overview';
  window.addEventListener('hashchange', ()=>{ const h = location.hash.slice(1);
    if(SECTIONS.some(s=>s[0]===h) && h!==ROUTE){ ROUTE = h; render(); } });
  render();
}
if(checkSession()) startApp(); else $('ad_email').focus();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pluto Collections — Premium Clothing, Jewellery &amp; Perfume</title>
<meta name="description" content="Pluto Collections: curated premium clothing, fine jewellery and signature fragrances. Timeless design, UPI checkout, cash on delivery and live order tracking." />
<meta property="og:title" content="Pluto Collections — Premium Clothing, Jewellery &amp; Perfume" />
<meta property="og:description" content="Curated premium clothing, fine jewellery and signature fragrances." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="images/logo1.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Karla:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<style>
:root{
  --brown:#3a2415; --brown-2:#5a3b23; --gold:#c6a43b; --gold-dark:#9a7c26;
  --ivory:#f7f3ea; --sand:#efe7d8; --ink:#20160e; --muted:#6d5c4a; --line:#ddd0ba;
  --white:#fffdf9; --green:#1f8b4c; --red:#b23b3b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;scroll-behavior:smooth}
body{background:var(--ivory);color:var(--ink);font-family:'Karla',system-ui,sans-serif;font-size:15px;line-height:1.6}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;font-weight:600;letter-spacing:.02em;margin:0}
:focus-visible{outline:2px solid var(--gold-dark);outline-offset:2px}
.skip{position:absolute;left:-9999px;top:0;background:var(--brown);color:#fff;padding:10px 16px;z-index:999}
.skip:focus{left:8px;top:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wrap{max-width:1220px;margin:0 auto;padding:0 22px}
.sec{padding:64px 0}
.eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold-dark);margin:0}
.rule{width:64px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:14px 0}
.btn{border:1px solid var(--brown);background:transparent;color:var(--brown);padding:11px 18px;cursor:pointer;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;transition:.2s;border-radius:0;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;line-height:1.1;min-height:44px}
.btn i{font-size:12px}
.btn:hover{background:var(--brown);color:var(--ivory)}
.btn.gold{border:1px solid transparent;color:#fff;background:linear-gradient(120deg,var(--brown),var(--brown-2) 45%,var(--gold-dark))}
.btn.gold:hover{filter:brightness(1.14)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{background:var(--sand);color:var(--brown)}
.btn.sm{padding:9px 10px;font-size:10px;letter-spacing:.12em;min-height:40px}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--white);border-radius:0;outline:none;min-height:44px}
textarea{min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:block;margin:0 0 5px}
.field{margin-bottom:12px}
.hide{display:none!important}
.err{color:var(--red);font-size:12px;margin:6px 0 0}

/* header */
header{position:sticky;top:0;z-index:60;background:rgba(247,243,234,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:84px;gap:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:62px;width:auto;background:transparent;transition:.25s}
.brand:hover img{transform:scale(1.04)}
.navlinks{display:flex;gap:22px;align-items:center}
.navlinks a{font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:8px 0;border-bottom:1px solid transparent;
  display:inline-flex;align-items:center;gap:8px;min-height:40px}
.navlinks a i{color:var(--gold-dark);font-size:13px}
.navlinks a:hover,.navlinks a[aria-current="page"]{border-bottom-color:var(--gold)}
.navtools{display:flex;align-items:center;gap:4px}
.icobtn{background:none;border:1px solid transparent;cursor:pointer;position:relative;padding:10px;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;display:inline-flex;align-items:center;gap:7px;min-height:44px;min-width:44px;justify-content:center}
.icobtn:hover{border-color:var(--line);color:var(--gold-dark)}
.icobtn i{font-size:15px}
.badge{position:absolute;top:2px;right:2px;background:var(--brown);color:#fff;font-size:9px;min-width:17px;height:17px;
  display:grid;place-items:center;border-radius:0}
#burger{display:none}
@media(max-width:980px){
  .navlinks{position:absolute;top:84px;left:0;right:0;background:var(--ivory);border-bottom:1px solid var(--line);
    flex-direction:column;gap:0;padding:6px 22px 14px;display:none;align-items:stretch}
  .navlinks.open{display:flex}
  .navlinks a{padding:13px 0;border-bottom:1px solid var(--line)}
  #burger{display:inline-flex}
  .icobtn span.lbl{display:none}
}
@media(max-width:560px){.nav{height:70px}.brand img{height:48px}.wrap{padding:0 14px}.navlinks{top:70px}}

/* hero */
.hero{position:relative;height:min(78vh,560px);overflow:hidden;border-bottom:1px solid var(--line)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .cap{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  background:linear-gradient(180deg,rgba(32,22,14,.25),rgba(32,22,14,.68));color:#fff;padding:20px}
.hero h1{font-size:clamp(30px,6vw,64px);color:#fff}
.hero .dots{position:absolute;bottom:18px;left:0;right:0;display:flex;gap:8px;justify-content:center}
.hero .dots button{width:30px;height:8px;background:transparent;border:0;padding:0;cursor:pointer;position:relative}
.hero .dots button::after{content:"";position:absolute;left:0;right:0;top:3px;height:2px;background:rgba(255,255,255,.45)}
.hero .dots button[aria-current="true"]::after{background:var(--gold);height:3px}
@media(max-width:600px){.hero{height:400px}.sec{padding:44px 0}}

/* product card */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
@media(max-width:520px){.pgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}}
.card{background:var(--white);border:1px solid var(--line);position:relative;transition:.25s;display:flex;flex-direction:column}
.card:hover,.card:focus-within{box-shadow:0 18px 40px -28px rgba(58,36,21,.65);transform:translateY(-3px)}
.card .ph{aspect-ratio:3/4;overflow:hidden;background:var(--sand)}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:.5s;background:var(--sand)}
.card:hover .ph img{transform:scale(1.05)}
.card .body{padding:15px;display:flex;flex-direction:column;flex:1}
.card .brandline{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-dark);margin:0}
.card h3{font-size:18px;margin:4px 0 2px;line-height:1.25}
.card .ul{height:1px;width:38px;background:linear-gradient(90deg,var(--brown),var(--gold));margin:8px 0 10px;transition:width .3s}
.card:hover .ul{width:100%}
.price{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.price b{font-size:17px}
.price s{color:var(--muted);font-size:13px}
.price em{font-style:normal;font-size:11px;color:var(--gold-dark);letter-spacing:.1em}
.card .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:14px}
.card .acts .btn{width:100%;padding:10px 6px}
@media(max-width:520px){.card .acts{grid-template-columns:1fr}.card h3{font-size:15px}.card .body{padding:11px}}
.tag{position:absolute;top:10px;left:10px;background:var(--brown);color:#fff;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;padding:4px 9px;z-index:2}
.tag.out{background:var(--red)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(28,18,10,.62);z-index:100;display:grid;place-items:start center;padding:18px;overflow:auto}
.modal{background:var(--white);border:1px solid var(--line);max-width:1000px;width:100%;margin:auto}
.modal.narrow{max-width:560px}
.modal .head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--white);z-index:3}
.modal .pad{padding:22px}
@media(max-width:520px){.modal .pad{padding:16px}.overlay{padding:0}}
.x{background:none;border:1px solid transparent;font-size:22px;cursor:pointer;line-height:1;min-width:44px;min-height:44px}
.x:hover{border-color:var(--line)}
.gal{position:relative;background:var(--sand)}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--sand)}
.gal .arw{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,253,249,.94);border:1px solid var(--line);
  width:44px;height:44px;cursor:pointer;font-size:14px;display:grid;place-items:center}
.gal .arw.l{left:10px}.gal .arw.r{right:10px}
.thumbs{display:flex;gap:8px;padding:10px 0;flex-wrap:wrap}
.thumbs button{padding:0;border:1px solid var(--line);background:none;cursor:pointer;line-height:0}
.thumbs button[aria-current="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.thumbs img{width:58px;height:58px;object-fit:cover;background:var(--sand)}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.spec{border:1px solid var(--line);padding:10px 12px}
.spec span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:block}
.spec i{color:var(--gold-dark);margin-right:6px}
.chip{border:1px solid var(--line);padding:9px 13px;cursor:pointer;background:var(--white);font-size:12px;display:inline-flex;
  align-items:center;gap:6px;min-height:40px}
.chip[aria-pressed="true"],.chip.on{border-color:var(--brown);background:var(--brown);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatch{width:22px;height:22px;border:1px solid var(--line);display:inline-block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media(max-width:800px){.two{grid-template-columns:1fr}.specs{grid-template-columns:1fr}}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:410px;max-width:94vw;background:var(--white);z-index:110;
  border-left:1px solid var(--line);display:flex;flex-direction:column}
.drawer .items{flex:1;overflow:auto;padding:16px}
.citem{display:grid;grid-template-columns:70px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.citem img{width:70px;height:88px;object-fit:cover;background:var(--sand)}

/* sections */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media(max-width:760px){.cats{grid-template-columns:1fr}}
.cat{position:relative;height:300px;overflow:hidden;border:1px solid var(--line);display:block}
.cat img{width:100%;height:100%;object-fit:cover;transition:.5s;background:var(--sand)}
.cat:hover img{transform:scale(1.06)}
.cat span{position:absolute;inset:auto 0 0 0;background:linear-gradient(180deg,transparent,rgba(32,22,14,.82));color:#fff;
  padding:22px;font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:.06em}
.journal{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
@media(max-width:900px){.journal{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.journal{grid-template-columns:1fr;gap:18px}}
.jitem{background:var(--white);border:1px solid var(--line);display:flex;flex-direction:column;transition:.25s;overflow:hidden}
.jitem:hover{transform:translateY(-4px);box-shadow:0 20px 46px -32px rgba(58,36,21,.7)}
.jitem .jimg{aspect-ratio:16/10;overflow:hidden;background:var(--sand)}
.jitem .jimg img{width:100%;height:100%;object-fit:cover;transition:.5s}
.jitem:hover .jimg img{transform:scale(1.06)}
.jitem .jbody{padding:18px;display:flex;flex-direction:column;flex:1}
.jitem .jmeta{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-dark)}
.jitem h3{font-size:23px;margin:8px 0}
.jitem p{color:var(--muted);margin:0 0 14px}
.jitem .jfoot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dark);border-top:1px solid var(--line);padding-top:12px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media(max-width:900px){.plans{grid-template-columns:1fr}}
.plan{border:1px solid var(--line);padding:26px;background:var(--white);display:flex;flex-direction:column}
.plan.pro{border-color:var(--gold);box-shadow:0 20px 50px -34px rgba(58,36,21,.8)}
.plan .ico{font-size:22px;color:var(--gold-dark);margin-bottom:8px}
.plan ul{padding-left:0;margin:14px 0;color:var(--muted);list-style:none}
.plan ul li{padding:3px 0;font-size:14px}
.plan ul li i{color:var(--gold-dark);margin-right:8px;font-size:11px}
.plan .btn{margin-top:auto;width:100%}

/* about */
.abouthero{position:relative;min-height:340px;display:grid;place-items:center;text-align:center;color:#fff;overflow:hidden;border-bottom:1px solid var(--line)}
.abouthero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.abouthero .ov{position:relative;padding:60px 20px;background:linear-gradient(180deg,rgba(32,22,14,.45),rgba(32,22,14,.75));width:100%}
.abouthero h1{color:#fff;font-size:clamp(32px,6vw,56px)}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.abox{border:1px solid var(--line);background:var(--white);padding:26px;transition:.25s}
.abox:hover{transform:translateY(-4px);box-shadow:0 20px 46px -32px rgba(58,36,21,.7)}
.abox .ai{width:52px;height:52px;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold-dark);font-size:19px;margin-bottom:14px}
.abox h3{font-size:24px;margin-bottom:6px}
.abox p{color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{border:1px solid var(--line);background:var(--white);padding:18px;position:relative}
.stat b{font-family:'Cormorant Garamond',serif;font-size:30px;display:block;line-height:1.2}
.stat .si{color:var(--gold-dark);position:absolute;top:16px;right:16px}

/* footer */
footer{background:var(--brown);color:#e9dcc7;margin-top:40px}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1.6fr;gap:30px;padding:56px 0}
@media(max-width:900px){footer .cols{grid-template-columns:1fr 1fr;gap:26px}}
@media(max-width:560px){footer .cols{grid-template-columns:1fr}}
footer h4{color:#fff;font-size:20px;margin-bottom:10px}
footer a{display:flex;align-items:center;gap:9px;color:#d9c9ad;padding:6px 0;font-size:13px}
footer a i{width:18px;color:var(--gold);text-align:center}
footer a:hover{color:var(--gold)}
footer .soc{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
footer .soc a{border:1px solid rgba(255,255,255,.22);width:42px;height:42px;display:grid;place-items:center;padding:0}
footer .soc a i{width:auto}
footer .soc a:hover{border-color:var(--gold);background:rgba(198,164,59,.14)}
footer .bot{border-top:1px solid rgba(255,255,255,.12);padding:16px 0;font-size:12px;color:#c9b795;display:flex;
  justify-content:space-between;gap:12px;flex-wrap:wrap}
.flogo{height:56px;width:auto;margin-bottom:12px}

/* tables + dashboard bits */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:620px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}
.pill{font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:10px 14px;border:1px solid var(--line);
  cursor:pointer;background:var(--white);display:inline-flex;align-items:center;gap:7px;min-height:42px}
.pill[aria-selected="true"],.pill.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--brown);color:#fff;
  padding:13px 20px;z-index:200;font-size:13px;letter-spacing:.06em;max-width:92vw;text-align:center;box-shadow:0 14px 40px -18px #000}
.note{font-size:12px;color:var(--muted)}
.qr{display:grid;place-items:center;gap:10px;border:1px solid var(--line);padding:18px;background:var(--white)}
.qr img,.qr canvas{width:220px;height:220px;max-width:100%;background:#fff}
.qrwrap{position:relative;overflow:hidden}
.paid-ov{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;
  background:rgba(255,255,255,.94);opacity:0;visibility:hidden;transition:opacity .35s ease;z-index:3;padding:14px}
.paid-ov.show{opacity:1;visibility:visible}
.paid-ov b{font-size:20px;letter-spacing:.04em;color:#1f8b4c;font-family:var(--serif,Georgia),serif}
.tickc{width:104px;height:104px;border-radius:50%;background:#1f8b4c;color:#fff;display:grid;place-items:center;font-size:46px;transform:scale(.2);opacity:0}
.paid-ov.show .tickc{animation:tickpop .55s cubic-bezier(.2,1.5,.4,1) forwards, tickpulse 1.9s .6s ease-out infinite}
@keyframes tickpop{to{transform:scale(1);opacity:1}}
@keyframes tickpulse{0%{box-shadow:0 0 0 0 rgba(31,139,76,.45)}70%{box-shadow:0 0 0 26px rgba(31,139,76,0)}100%{box-shadow:0 0 0 0 rgba(31,139,76,0)}}
.verifyrow{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.verifyrow input{flex:1 1 190px;min-width:0}
.verifyrow .btn{white-space:nowrap}
.btn.okbtn{background:#1f8b4c!important;border-color:#1f8b4c!important;color:#fff!important;opacity:1}
@media (prefers-reduced-motion:reduce){.paid-ov.show .tickc{animation:none;transform:scale(1);opacity:1}}
.panel{border:1px solid var(--line);background:var(--white);padding:20px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:14px}
.kv div span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:block}
.kv div b{font-weight:600;word-break:break-word}
.mstatus{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--gold);color:var(--gold-dark);padding:7px 12px;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase}
.searchbar{position:relative;max-width:420px;flex:1;min-width:200px}
.searchbar i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px}
.searchbar input{padding-left:32px}
.state{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--line);padding:5px 10px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.g{background:var(--green);box-shadow:0 0 0 3px rgba(31,139,76,.18)}
.dot.a{background:var(--gold-dark);box-shadow:0 0 0 3px rgba(198,164,59,.2)}
.dot.r{background:var(--red);box-shadow:0 0 0 3px rgba(178,59,59,.18)}

/* tracker */
.track{margin-top:16px}
.tstep{display:grid;grid-template-columns:24px 1fr;gap:14px;position:relative;padding-bottom:20px}
.tstep:last-child{padding-bottom:0}
.tstep .bul{width:14px;height:14px;border-radius:50%;background:var(--sand);border:2px solid var(--line);margin-top:5px;z-index:2}
.tstep.done .bul{background:var(--green);border-color:var(--green);box-shadow:0 0 0 4px rgba(31,139,76,.15)}
.tstep.now .bul{background:var(--green);border-color:var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,139,76,.45)}70%{box-shadow:0 0 0 10px rgba(31,139,76,0)}100%{box-shadow:0 0 0 0 rgba(31,139,76,0)}}
.tstep::before{content:"";position:absolute;left:11px;top:20px;bottom:-4px;width:2px;background:var(--line)}
.tstep:last-child::before{display:none}
.tstep.done::before{background:var(--green)}
.tstep b{display:block;font-size:14px}
.tstep .note{margin:0}
@media print{header,footer,.noprint{display:none!important}}

/* ---- shop by category: icon tiles with animated arrows ---- */
.cattiles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:860px){.cattiles{grid-template-columns:1fr}}
.ctile{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);
  padding:18px 20px;min-height:104px;transition:transform .25s,box-shadow .25s,border-color .25s;position:relative;overflow:hidden}
.ctile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent);
  transform:scaleX(0);transform-origin:left;transition:transform .35s}
.ctile:hover{transform:translateY(-3px);box-shadow:0 18px 40px -30px rgba(58,36,21,.7);border-color:var(--gold)}
.ctile:hover::after{transform:scaleX(1)}
.ctile .ci{width:54px;height:54px;flex:0 0 54px;display:grid;place-items:center;border:1px solid var(--gold);
  color:var(--gold-dark);font-size:21px;transition:.3s}
.ctile:hover .ci{background:var(--sand)}
.ctile .ctxt{min-width:0;flex:1}
.ctile .ctxt b{font-family:'Cormorant Garamond',serif;font-size:23px;display:block;line-height:1.2}
.ctile .ctxt small{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.ctile .carw{width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;border:1px solid var(--line);
  color:var(--brown);font-size:16px;transition:transform .35s,background .25s,color .25s,border-color .25s}
.ctile:hover .carw{background:var(--brown);color:var(--ivory);border-color:var(--brown);transform:translateX(6px)}
.ctile.tapped .carw{animation:arwtap .5s ease;background:var(--brown);color:var(--ivory);border-color:var(--brown)}
@keyframes arwtap{0%{transform:translateX(0)}40%{transform:translateX(20px);opacity:.25}
  55%{transform:translateX(-14px);opacity:.35}100%{transform:translateX(0);opacity:1}}
@media(max-width:560px){.ctile{padding:14px;min-height:88px;gap:11px}
  .ctile .ctxt b{font-size:20px}.ctile .ci{width:46px;height:46px;flex:0 0 46px;font-size:18px}
  .ctile .carw{width:42px;height:42px;flex:0 0 42px}}

/* ---- member pricing chip ---- */
.memtag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold);color:var(--gold-dark);
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px}

/* ---- extra responsiveness ---- */
@media(max-width:760px){
  .kv{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .plans{gap:14px}.plan{padding:20px}
  .cat{height:220px}
}
@media(max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .sec{padding:38px 0}
  .panel{padding:15px}
  h2{font-size:26px!important}
  .drawer{width:100%}
  footer .cols{padding:38px 0}
}
@media(max-width:400px){
  .pgrid{grid-template-columns:repeat(2,1fr);gap:11px}
  .btn{padding:10px 12px;font-size:10px;letter-spacing:.1em}
  .card .body{padding:9px}
  .stats{grid-template-columns:1fr}
}

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';

      ...(DEF_PLAN_PERKS[m.name]||{}) })),

    users: [{ id:'u_admin', full_name:'Store Owner', email:'admin@pluto.com', password:'admin123', phone:'9000000000',
              role:'admin', address:'', city:'', pincode:'', age:'', gender:'', membership:null, created_at:now }],
    orders: [], seq: 1000
  };
}
function loadDB(){
  try{
    const raw = localStorage.getItem(DBKEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.products)){
        const base = freshDB();
        return { ...base, ...d,
          nav: (Array.isArray(d.nav) && d.nav.length) ? d.nav : base.nav,
          pages: Array.isArray(d.pages) ? d.pages : [],
          memberships: (d.memberships||base.memberships).map(m=>({
            discount_pct:0, free_shipping:false, priority_dispatch:false, early_access:false,
            ...(m.discount_pct===undefined ? (DEF_PLAN_PERKS[m.name]||{}) : {}), ...m,
            ...(m.discount_pct===undefined ? (DEF_PLAN_PERKS[m.name]||{}) : {}) })),
          settings:{ ...base.settings, ...(d.settings||{}) },
          policies:{ ...base.policies, ...(d.policies||{}) },
          bill:{ ...DEF_BILL, ...(d.bill||{}) },
          journal:{ ...base.journal, ...(d.journal||{}) },
          about:{ ...base.about, ...(d.about||{}) },
          footer:{ ...base.footer, ...(d.footer||{}) } };
      }
    }
  }catch(e){ console.warn('DB reset', e); }
  return freshDB();
}

  if(f) f.qty = Math.min(99, f.qty + qty); else

const taxPct  = () => Math.max(0, Math.min(40, Number(DB.settings.tax_pct ?? 5)));
const taxFree = () => { const p = activePlan(); return !!p && (p.tax_free !== undefined ? !!p.tax_free : /premium|exclusive/i.test(p.name||'')); };
const taxFee  = t => taxFree() ? 0 : Math.round(Number(t||0) * taxPct() / 100);

/* ------------------------- membership benefits engine -------------------------
   A live subscription lowers every product price by the plan's discount, and can
   unlock free shipping, priority dispatch and early access. All owner-controlled. */
function activePlan(){
  const m = S.user?.membership;
  if(!m || m.status!=='active') return null;
  if(m.valid_till && new Date(m.valid_till) < new Date()) return null;
  return DB.memberships.find(p=>p.name===m.plan) || null;
}
function memberPct(){
  const p = activePlan();
  return p ? Math.max(0, Math.min(80, Number(p.discount_pct||0))) : 0;
}
const memberFreeShip = () => !!activePlan()?.free_shipping;
/* price the signed-in shopper actually pays */
const priceOf = p => Math.max(1, Math.round(Number(p.discounted||0) * (1 - memberPct()/100)));
const isMemberPrice = p => priceOf(p) < Number(p.discounted||0);
function planPerkLines(m){
  const out = [];
  if(Number(m.discount_pct||0) > 0) out.push(Number(m.discount_pct)+'% off every product price');
  if(m.free_shipping)     out.push('Free shipping on every order');
  if(m.priority_dispatch) out.push('Priority dispatch from the studio');
  if(m.early_access)      out.push('Early access to new drops');
  return out;
}

      `<i class="${attr(n.icon||'fas fa-link')}" aria-hidden="true"></i>${esc(n.label)}</a>`;

/* ------------------------------ router ------------------------------ */
function render(){
  renderNav();
  const v = $('main'), r = S.route;
  if(r === '/') v.innerHTML = viewHome();
  else if(r === '/collections') v.innerHTML = viewCollection('All','The Collection','Every piece, one place.');
  else if(r === '/clothing') v.innerHTML = viewCollection('Clothing','Clothing','Tailored essentials in natural fibres.');
  else if(r === '/jewellery') v.innerHTML = viewCollection('Jewellery','Jewellery','Fine metals, quiet sparkle.');
  else if(r === '/perfume') v.innerHTML = viewCollection('Perfume','Perfume','Signature fragrances that linger.');
  else if(r === '/membership') v.innerHTML = viewMembership();
  else if(r === '/about') v.innerHTML = viewAbout();
  else if(r === '/policies') v.innerHTML = viewPolicies();
  else if(r === '/auth') v.innerHTML = viewAuth();
  else if(r === '/account') v.innerHTML = S.user ? viewAccount() : viewAuth();
  else if(r.startsWith('/page/')) v.innerHTML = viewPage(decodeURIComponent(r.slice(6)));
  else v.innerHTML = `<div class="wrap sec"><p class="eyebrow">404</p><h1>Page not found</h1><div class="rule"></div>
      <button class="btn" onclick="go('/')"><i class="fas fa-house"></i> Back to store</button></div>`;
  if(r === '/') setHero();
  if(['/collections','/clothing','/jewellery','/perfume'].includes(r)) paintGrid();
}

/* ------------------------------ collections ------------------------------ */
function viewCollection(cat, title, sub){
  S.cat = (cat==='All' && S.cat && ['All','Clothing','Jewellery','Perfume'].includes(S.cat)) ? S.cat : cat;
  if(cat!=='All') S.cat = cat;
  return `<div class="wrap sec">
    <p class="eyebrow">Collections</p><h1 style="font-size:clamp(30px,5vw,44px)">${esc(title)}</h1><div class="rule"></div>
    <p class="note">${esc(sub)}</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin:22px 0;align-items:center">
      <div class="searchbar"><i class="fas fa-magnifying-glass" aria-hidden="true"></i>
        <label class="sr-only" for="searchBox">Search the collection</label>
        <input id="searchBox" type="search" placeholder="Search by name, brand or material…" value="${attr(S.q)}" oninput="S.q=this.value;paintGrid()" /></div>
      ${cat==='All'?`<div class="tabs" id="catTabs" role="tablist" aria-label="Filter by category" style="margin:0">
        ${['All','Clothing','Jewellery','Perfume'].map(c=>`<button role="tab" class="pill" aria-selected="${S.cat===c}" onclick="pickCat('${c}')">${c}</button>`).join('')}</div>`:''}
      <div style="min-width:190px"><label class="sr-only" for="sortSel">Sort products</label>
      <select id="sortSel" onchange="S.sort=this.value;paintGrid()">
        <option value="feat">Featured</option><option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option><option value="name">Name A–Z</option><option value="disc">Biggest discount</option>
      </select></div>
    </div>
    <p class="note" id="countMsg" aria-live="polite"></p>
    <div class="pgrid" id="grid" style="margin-top:14px"></div>
    <p class="note" id="emptyMsg" style="display:none">No pieces match your search. Try a different word or clear the filters.</p>
  </div>`;
}
function filtered(){
  const q = S.q.trim().toLowerCase();
  let list = activeProducts().filter(p =>
    (S.cat==='All' || p.category===S.cat) &&
    (!q || [p.name,p.brand,p.material,p.description,p.color,p.category,p.fit,p.features].join(' ').toLowerCase().includes(q)));
  const s = S.sort;
  if(s==='low')  list = [...list].sort((a,b)=>a.discounted-b.discounted);
  if(s==='high') list = [...list].sort((a,b)=>b.discounted-a.discounted);
  if(s==='name') list = [...list].sort((a,b)=>a.name.localeCompare(b.name));
  if(s==='disc') list = [...list].sort((a,b)=>(1-b.discounted/b.original)-(1-a.discounted/a.original));
  return list;
}
function pickCat(c){
  S.cat = c;
  document.querySelectorAll('#catTabs .pill').forEach(el=>el.setAttribute('aria-selected', String(el.textContent.trim()===c)));
  paintGrid();
}
function paintGrid(){
  const g = $('grid'); if(!g) return;
  const list = filtered();
  g.innerHTML = list.map(cardHTML).join('');
  $('emptyMsg').style.display = list.length ? 'none' : 'block';
  $('countMsg').textContent = `${list.length} piece${list.length===1?'':'s'}`;
}
function cardHTML(p){
  const pay = priceOf(p);
  const off = p.original > pay ? Math.round((1 - pay/p.original)*100) : 0;
  const out = /out/i.test(p.stock||'');
  return `<article class="card">
    ${out?'<span class="tag out">Sold out</span>':(off?`<span class="tag">${off}% off</span>`:'')}
    <div class="ph"><img src="${attr(p.img)}" alt="${attr(p.name)} — ${attr(p.brand)}" loading="lazy" /></div>
    <div class="body">
      <p class="brandline">${esc(p.brand)}</p>
      <h3>${esc(p.name)}</h3>
      <div class="ul" aria-hidden="true"></div>
      <div class="price"><b>${money(pay)}</b>${off?`<s><span class="sr-only">Was </span>${money(p.original)}</s>`:''}<em>${esc(p.stock)}</em>
        ${isMemberPrice(p)?`<span class="memtag"><i class="fas fa-crown" aria-hidden="true"></i> Member price</span>`:''}</div>
      <div class="acts">
        <button class="btn sm" onclick="openProduct('${p.id}')" aria-label="View details for ${attr(p.name)}"><i class="fas fa-eye" aria-hidden="true"></i> View details</button>
        <button class="btn sm gold" onclick="buyNow('${p.id}')" ${out?'disabled':''} aria-label="Buy ${attr(p.name)} now"><i class="fas fa-bolt" aria-hidden="true"></i> Buy now</button>
      </div>
    </div>
  </article>`;
}

/* ------------------------- forgot password (email + name verification) ------------------------- */
function fpResetPassword(e){
  e.preventDefault();
  const err = $('fpErr'); err.textContent = '';
  const f = new FormData(e.target);
  const email = String(f.get('email')).trim().toLowerCase();
  const name  = String(f.get('full_name')).trim().toLowerCase();
  const pass  = String(f.get('password'));
  const u = DB.users.find(x=>String(x.email).toLowerCase()===email);
  if(!u){ err.textContent = 'No account found with this email.'; return; }
  if(String(u.full_name||'').trim().toLowerCase() !== name){ err.textContent = 'The name does not match the one saved on this account.'; return; }
  if(pass.length < 6){ err.textContent = 'Password must be at least 6 characters.'; return; }
  u.password = pass; saveDB();
  e.target.reset();
  toast('Password updated — you can sign in now');
  switchAuth('login');
}
function doLogin(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const email = String(f.get('email')).trim().toLowerCase();
  const u = DB.users.find(x=>x.email===email);
  if(!u || u.password !== String(f.get('password'))){ $('loginErr').textContent = 'Invalid credentials — check your email and password.'; return; }
  if(u.role==='admin'){ $('loginErr').textContent = 'Owner accounts sign in through the admin dashboard page.'; return; }
  S.token = u.id; localStorage.setItem('pluto_token', u.id); refreshUser();
  toast('Signed in as ' + u.full_name); go('/account');
}
function doRegister(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const email = String(f.get('email')).trim().toLowerCase();
  const err = $('regErr'); err.textContent='';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)){ err.textContent='Enter a valid email address.'; return; }
  if(DB.users.some(u=>u.email===email)){ err.textContent='An account with this email already exists.'; return; }
  if(String(f.get('password')).length < 6){ err.textContent='Password must be at least 6 characters.'; return; }
  const u = { id:uid(), full_name:String(f.get('full_name')).trim(), email, password:String(f.get('password')),
    phone:String(f.get('phone')||''), role:'customer', address:'', city:'', pincode:'', age:'', gender:'',
    membership:null, created_at:new Date().toISOString() };
  DB.users.push(u); saveDB();
  S.token = u.id; localStorage.setItem('pluto_token', u.id); refreshUser();
  toast('Welcome to Pluto Collections'); go('/account');
}

  return `<span class="state"><span class="dot ${c}"></span>${l}</span>`;

  ['out_for_delivery','Out for delivery','fas fa-motorcycle'],

];
function trackerHTML(o){
  if(o.status==='cancelled')
    return `<p class="note" style="margin-top:12px"><span class="state"><span class="dot r"></span>Cancelled</span> — this order was cancelled on ${fmtDay(o.cancelled_at||o.created_at)}.</p>`;
  const idx = TRACK_STEPS.findIndex(s=>s[0]===o.status);
  const hist = o.tracking?.history || [];
  return `<div class="track">
    ${TRACK_STEPS.map(([k,l,ic],i)=>{
      const done = i < idx, now = i === idx;
      const h = hist.find(x=>x.step===k);
      return `<div class="tstep ${done?'done':''} ${now?'done now':''}">
        <span class="bul" aria-hidden="true"></span>
        <div><b><i class="${ic}" aria-hidden="true" style="color:${done||now?'var(--green)':'var(--muted)'};width:20px"></i> ${l}</b>
        <p class="note">${h? esc(h.place||'') + (h.note?' · '+esc(h.note):'') + ' · ' + fmtDate(h.at) : (done||now?'Updated by the studio':'Pending')}</p></div>

/* ------------------------------ modal helpers ------------------------------ */
let lastFocus = null;
function openModal(html){
  lastFocus = document.activeElement;
  document.body.style.overflow='hidden';
  $('modals').innerHTML = html;
  const box = $('modals').querySelector('.modal,.drawer');
  if(box){ box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true'); }
  const f = $('modals').querySelector('button,input,select,textarea,a[href]');
  if(f) f.focus();
}
function closeModal(){
  $('modals').innerHTML=''; document.body.style.overflow='';
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
document.addEventListener('keydown', e=>{
  const open = $('modals').children.length;
  if(e.key === 'Escape'){
    if(open) closeModal();
    else if($('navlinks').classList.contains('open')) toggleMenu(false);
  }
  if(e.key === 'Tab' && open){
    const box = $('modals').querySelector('.modal,.drawer'); if(!box) return;
    const items = [...box.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])')]
      .filter(el=>el.offsetParent !== null);
    if(!items.length) return;
    const first = items[0], last = items[items.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

function placeOrder(e){
  e.preventDefault();

  const pin = String(f.get('pincode')||'').replace(/\D/g,'');
  const utr = String(f.get('utr')||'').replace(/\D/g,'');
  if(!String(f.get('customer_name')||'').trim()){ err.textContent='Enter your full name.'; return; }
  if(phone.length !== 10){ err.textContent='Enter a valid 10-digit phone number.'; return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)){ err.textContent='Enter a valid email address.'; return; }
  if(!String(f.get('address')||'').trim()){ err.textContent='Enter a delivery address.'; return; }
  if(pin.length !== 6){ err.textContent='Enter a valid 6-digit pincode.'; return; }
  if(CO.method==='upi' && utr.length !== 12){ err.textContent='Enter the 12-digit UTR / transaction id from your UPI app.'; return; }
  if(CO.method==='upi' && !CO.verified){ err.textContent='Tap Verify to confirm your 12-digit transaction id before placing the order.'; return; }

  const now = new Date().toISOString();
  DB.seq += 1;

/* --------------------- UPI verification + payment-done animation --------------------- */
function resetVerify(which){
  const st = which==='mb' ? MB : CO;
  if(!st.verified) return;
  st.verified = false;
  const ov = $(which==='mb'?'mbPaidOv':'coPaidOv');
  if(ov){ ov.classList.remove('show'); ov.setAttribute('aria-hidden','true'); }
  const btn = $(which==='mb'?'mbVerify':'coVerify');
  if(btn){ btn.disabled=false; btn.classList.remove('okbtn'); btn.innerHTML='<i class="fas fa-shield-halved" aria-hidden="true"></i> Verify'; }
  const note = $(which==='mb'?'mbVnote':'coVnote'); if(note) note.textContent='';
}
function verifyUTR(which){
  const inp = $(which==='mb'?'mb_utr':'co_utr');
  const errEl = $(which==='mb'?'mbErr':'coErr');
  const btn = $(which==='mb'?'mbVerify':'coVerify');
  const note = $(which==='mb'?'mbVnote':'coVnote');
  const v = String(inp.value||'').replace(/\D/g,'');
  if(v.length !== 12){
    if(errEl) errEl.textContent = 'Enter the full 12-digit UTR / transaction id before verifying.';
    inp.focus(); return;
  }
  if(errEl) errEl.textContent = '';
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i> Verifying';
  if(note) note.textContent = 'Matching transaction ' + v + ' with the UPI gateway…';
  setTimeout(()=>{
    if(which==='mb') MB.verified = true; else CO.verified = true;
    const ov = $(which==='mb'?'mbPaidOv':'coPaidOv');
    if(ov){ ov.classList.add('show'); ov.setAttribute('aria-hidden','false'); }
    btn.classList.add('okbtn');
    btn.innerHTML = '<i class="fas fa-circle-check" aria-hidden="true"></i> Verified';
    inp.readOnly = true;
    if(note) note.innerHTML = '<i class="fas fa-shield-halved" aria-hidden="true"></i> Payment verified · your bill and receipt are ready';
    toast('Payment done · transaction ' + v + ' verified');
    $('live').textContent = 'Payment done. Transaction verified.';
  }, 950);
}

function openReceipt(ref){

  } else {
    const o = DB.orders.find(x=>x.id===ref); if(!o) return toast('Order not found');
    html = receiptHTML('order', o);
  }
  const w = window.open('', '_blank');
  if(!w){ toast('Allow pop-ups to view the receipt'); return; }
  w.document.write(html); w.document.close();
}

<script>
function dlHTML(){
  var blob = new Blob(['<!doctype html>' + document.documentElement.outerHTML], {type:'text/html'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = ${JSON.stringify(fileName)};
  document.body.appendChild(a); a.click(); a.remove();
}
<\/script>
</body></html>`;
}
function openBill(ref){
  let html;
  if(String(ref).startsWith('mem:')){
    const u = DB.users.find(x=>x.id===String(ref).slice(4));
    if(!u || !u.membership) return toast('No membership found');
    html = billHTML('mem', { ...u.membership, user_name:u.full_name, user_email:u.email, user_phone:u.phone });
  } else {
    const o = DB.orders.find(x=>x.id===ref);
    if(!o) return toast('Order not found');
    html = billHTML('order', o);
  }
  const w = window.open('', '_blank');
  if(!w){ toast('Allow pop-ups to open the payment bill'); return; }
  w.document.write(html); w.document.close();
}

/* ------------------------------ boot ------------------------------ */
function toggleMenu(force){
  const n = $('navlinks'), open = force !== undefined ? force : !n.classList.contains('open');
  n.classList.toggle('open', open);
  $('burger').setAttribute('aria-expanded', String(open));
  $('burger').setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
}
function boot(){
  refreshUser();
  applySettings(); renderFooter(); saveCart();
  $('burger').addEventListener('click', ()=>toggleMenu());
  $('cartBtn').addEventListener('click', openCart);
  $('accBtn').addEventListener('click', ()=>go(S.user ? '/account' : '/auth'));
  $('navlinks').addEventListener('click', e=>{ if(e.target.closest('a')) toggleMenu(false); });
  window.addEventListener('hashchange', ()=>{ S.route = location.hash.slice(1) || '/'; toggleMenu(false); render(); });
  S.route = location.hash.slice(1) || '/';
  render();
  setInterval(()=>{ if(S.route==='/' && activeBanners().length>1){ S.slide = (S.slide+1) % activeBanners().length; setHero(); } }, 5600);
}
boot();
</script></body></html>
